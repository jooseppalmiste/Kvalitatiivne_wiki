<!doctype html>
<html>
  <head>
     <script>
        function kysi(){ 
           let lause=`
             SELECT ?item ?itemLabel
              WHERE
              {
                ?item wdt:P27 wd:${riik.value}. 
                ?item wdt:P106 wd:${amet.value}.
              
                SERVICE wikibase:label {
                  bd:serviceParam wikibase:language "[AUTO_LANGUAGE],mul,en".
                } 
              }
              LIMIT 10
           `;
           let aadress="https://query.wikidata.org/sparql?format=json&query="+encodeURI(lause);
          vastus.innerHTML="ootan vastust";
           fetch(aadress).then(d => d.json()).then(kuva);
        }

        function kuva(d){
           console.log(d);
           vastus.innerHTML="";
           for(let rida of d["results"]["bindings"]){
              console.log(rida["itemLabel"]["value"]);
              let lause=document.createElement("li");
              lause.textContent=rida["itemLabel"]["value"];
              vastus.appendChild(lause);
           }
        }
     </script>
    </head>
  </body>
</html>
