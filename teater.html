<!doctype html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Eesti teatriinimesed Wikidatas</title>
  <script>
    function kysi() {
      let amet = document.getElementById("amet").value;
      let ametinimi = document.getElementById("amet").selectedOptions[0].textContent.toLowerCase();

      // 1. päring: millistes koolides on valitud ameti esindajad õppinud?
      let lause1 = `
        SELECT ?kool ?koolLabel (COUNT(DISTINCT ?isik) AS ?kogus)
        WHERE {
          ?isik wdt:P27 wd:Q191.
          ?isik wdt:P106 wd:${amet}.
          ?isik wdt:P69 ?kool.
          SERVICE wikibase:label {
            bd:serviceParam wikibase:language "et,en".
          }
        }
        GROUP BY ?kool ?koolLabel
        ORDER BY DESC(?kogus)
      `;

      // 2. päring: mitu valitud ameti esindajat on Wikidatas?
      let lause2 = `
        SELECT (COUNT(DISTINCT ?isik) AS ?kogus)
        WHERE {
          ?isik wdt:P27 wd:Q191.
          ?isik wdt:P106 wd:${amet}.
        }
      `;

      let vastus1 = document.getElementById("vastus1");
      let vastus2 = document.getElementById("vastus2");
      document.getElementById("kusimus1").textContent = "Millistes koolides on Eesti " + ametinimi + "d õppinud?";
      document.getElementById("kusimus2").textContent = "Mitu Eesti " + ametinimi + "t on Wikidatas?";
      vastus1.textContent = "ootan vastust";
      vastus2.textContent = "ootan vastust";

      let aadress1 = "https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(lause1);
      let aadress2 = "https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(lause2);

      fetch(aadress1)
        .then(d => { if (!d.ok) throw new Error("Viga"); return d.json(); })
        .then(d => {
          vastus1.textContent = "";
          let read = d.results.bindings;
          if (!read.length) { vastus1.textContent = "Tulemusi ei leitud."; return; }
          let loend = document.createElement("ul");
          for (let rida of read) {
            let li = document.createElement("li");
            li.textContent = rida.koolLabel.value + " = " + rida.kogus.value;
            loend.appendChild(li);
          }
          vastus1.appendChild(loend);
        })
        .catch(() => vastus1.textContent = "Päring ebaõnnestus.");

      fetch(aadress2)
        .then(d => { if (!d.ok) throw new Error("Viga"); return d.json(); })
        .then(d => {
          vastus2.textContent = d.results.bindings[0]?.kogus?.value ?? "0";
        })
        .catch(() => vastus2.textContent = "Päring ebaõnnestus.");
    }
    window.addEventListener("DOMContentLoaded", kysi);
  </script>
</head>
<body>
  <select id="amet" onchange="kysi()">
    <option value="Q33999">näitleja</option>
    <option value="Q3387717">lavastaja</option>
  </select>
  <input type="button" value="otsi" onclick="kysi()">
  <p id="kusimus1"></p>
  <ul id="vastus1"></ul>
  <p id="kusimus2"></p>
  <div id="vastus2"></div>
</body>
</html>
